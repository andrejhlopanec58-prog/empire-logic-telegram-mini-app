<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Fruit Factory</title><script src="https://telegram.org/js/telegram-web-app.js"></script><script src="https://sad.adsgram.ai/js/sad.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#10151a;color:#fff}main{max-width:520px;margin:auto;padding:14px}.card{background:#192128;border:1px solid #2a3740;border-radius:20px;padding:16px;margin:10px 0}.top{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#222d35;border-radius:14px;padding:10px;text-align:center}.big{font-size:22px;font-weight:800}button{width:100%;padding:14px;margin-top:8px;border:0;border-radius:14px;font-size:16px;font-weight:800}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.bar{height:9px;background:#303d46;border-radius:8px;overflow:hidden}.fill{height:100%;width:0;background:#82d37a}.muted{color:#9ba8b1}#toast{text-align:center;min-height:24px;padding:5px}
</style></head><body><main>
<div class="card"><h1>🍎 Fruit Factory</h1><div class="top"><div class="stat">💰<div class="big" id="coins">—</div>Coins</div><div class="stat">💎<div class="big" id="gems">—</div>Gems</div><div class="stat">⚡<div class="big" id="energy">—</div>Energy</div></div></div>
<div class="card">⭐ Level <b id="level">—</b> · 🏭 Factory <b id="factory">—</b><div class="bar"><div class="fill" id="xpbar"></div></div></div>
<div class="card"><h2>🍓 Производство</h2><p class="muted">Собирай фрукты, производи и продавай.</p><div class="row"><button id="collect">🍓 Собрать</button><button id="produce">🏭 Произвести</button></div><button id="sell">💰 Продать партию</button></div>
<div class="card"><h2>⬆️ Фабрика</h2><p>Цена улучшения: <b id="cost">—</b> Coins</p><button id="upgrade">⬆️ Улучшить</button><button id="prestige">♻️ Престиж с Level 10</button></div>
<div class="card"><h2>🎁 Награды</h2><button id="daily">🎁 Daily Reward</button><button id="ad">📺 Rewarded Ad → +50 Coins</button></div>
<div class="card"><h2>🏆 Leaderboard</h2><div id="top" class="muted">Загрузка...</div></div><div id="toast"></div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||"";let U=null;
const $=x=>document.getElementById(x);
function render(){if(!U)return;$("coins").textContent=U.coins.toLocaleString();$("gems").textContent=U.gems;$("energy").textContent=U.energy;$("level").textContent=U.level;$("factory").textContent=U.factory;$("cost").textContent=U.upgradeCost.toLocaleString();$("xpbar").style.width=Math.min(100,U.xp/U.xpNeed*100)+"%"}
function toast(x){$("toast").textContent=x;setTimeout(()=>$("toast").textContent="",2500)}
async function post(url,extra={}){let r=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData,...extra})});let d=await r.json();if(!r.ok)throw Error(d.error||"Ошибка");return d}
async function act(url,extra={}){try{let d=await post(url,extra);if(d.user){U=d.user;render()}if(d.reward)toast("🎉 +"+d.reward+" Coins");tg?.HapticFeedback?.impactOccurred("light")}catch(e){toast("⚠️ "+e.message)}}
$("collect").onclick=()=>act("/api/collect");$("produce").onclick=()=>act("/api/produce");$("sell").onclick=()=>act("/api/sell");$("upgrade").onclick=()=>act("/api/upgrade");$("daily").onclick=()=>act("/api/daily");$("prestige").onclick=()=>act("/api/prestige");
$("ad").onclick=async()=>{try{let c=await fetch("/api/config").then(r=>r.json());if(!c.adsgramBlockId)return toast("Укажи ADSGRAM_BLOCK_ID.");let a=window.Adsgram?.init({blockId:c.adsgramBlockId});if(!a)return toast("AdsGram SDK недоступен.");toast("📺 Загружаем рекламу...");await a.show();await act("/api/ad/reward",{idempotencyKey:crypto.randomUUID()})}catch(e){toast("Реклама не завершена или недоступна.")}};
async function init(){try{let r=await fetch("/api/auth",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({initData})});let d=await r.json();if(!r.ok)throw Error(d.error);U=d;render();let a=await fetch("/api/leaderboard").then(r=>r.json());$("top").innerHTML=a.map(x=>`${x.rank}. ${x.name} — 💰 ${x.coins.toLocaleString()} · Lv.${x.level}`).join("<br>")}catch(e){toast("Открой игру через Telegram.")}}init();
</script></body></html>
